<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowScale</title>
<style id="css"></style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 16c3.5 0 4.5-8 9-8s5.5 8 9 8"/></svg></div>
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-8 4 14 3-6h4"/></svg><span data-t="tab.home"></span></button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-t="tab.settings"></span></button>
    <button class="tab" data-tab="ingame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M8 12l3-3 2 2 3-3"/></svg><span data-t="tab.ingame"></span></button>
    <div class="rail-foot"><select id="lang" class="lang" aria-label="Language"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select></div>
  </nav>

  <main>
    <header class="bar">
      <h1 id="pageTitle"></h1>
      <select id="profile" class="field" style="width: 210px" aria-label="Profile"></select>
      <button id="btnAddProfile" class="btn btn-quiet" data-t="profile.add"></button>
      <button id="btnRemoveProfile" class="btn btn-quiet" data-t="profile.remove"></button>
      <div class="spacer"></div>
      <span id="keysHint" class="muted" style="font-size:12px"></span>
    </header>

    <section class="page" data-page="home">
      <div class="home">
        <div id="rtssBox" class="notice hidden"><div><h3 data-t="rtss.title"></h3><p data-t="rtss.body"></p></div><button class="btn btn-line" id="btnRtss" data-t="rtss.fix"></button></div>
        <div class="tiles">
          <article class="tile" id="tileScale">
            <div><h2 data-t="home.scale"></h2><p class="state" id="scaleState"></p></div>
            <div class="chips" id="scaleChips"></div>
            <div class="acts"><button id="btnScale" class="btn btn-primary btn-lg"></button><span class="muted" id="scaleKey"></span></div>
          </article>
          <article class="tile" id="tileLimit">
            <div><h2 data-t="home.limit"></h2><p class="state" id="limState"></p></div>
            <div class="chips" id="limChips"></div>
            <div class="acts"><button id="btnLimit" class="btn btn-primary btn-lg"></button><span class="muted" id="limKey"></span></div>
          </article>
        </div>

        <div id="smoothTip" class="notice tip hidden"><div><h3 data-t="smooth.title"></h3><p data-t="smooth.body"></p></div><button class="btn btn-primary" id="btnSmooth" data-t="smooth.apply"></button></div>

        <section class="card">
          <div class="card-head">
            <div><h2 data-t="graph.title"></h2><p id="graphSub"></p></div>
            <div class="legend"><span><i style="background:var(--game)"></i><span data-t="graph.game"></span></span><span><i style="background:var(--accent)"></i><span data-t="graph.out"></span></span></div>
          </div>
          <canvas id="graph"></canvas>
          <dl class="metrics">
            <div class="metric game"><dt data-t="m.fps"></dt><dd id="mLimFps">—</dd></div>
            <div class="metric"><dt data-t="m.low1"></dt><dd id="mLimLow">—</dd></div>
            <div class="metric"><dt data-t="m.sd"></dt><dd id="mLimSd">—</dd></div>
            <div class="metric"><dt data-t="m.cap"></dt><dd id="mLimCap">—</dd></div>
            <div class="metric out"><dt data-t="m.outfps"></dt><dd id="mOutFps">—</dd></div>
            <div class="metric"><dt data-t="m.captured"></dt><dd id="mRealFps">—</dd></div>
            <div class="metric"><dt data-t="m.ratio"></dt><dd id="mRatio">—</dd></div>
            <div class="metric"><dt data-t="m.sd"></dt><dd id="mOutSd">—</dd></div>
          </dl>
        </section>

        <section class="card">
          <div class="card-head"><div><h2 data-t="quick.title"></h2><p data-t="quick.sub"></p></div><button class="btn btn-quiet" data-go="settings" data-t="quick.all"></button></div>
          <div class="quick" id="quick"></div>
        </section>
      </div>
    </section>

    <section class="page hidden" data-page="settings">
      <div class="settings">
        <aside class="index"><input id="search" class="field" type="search" autocomplete="off"><div id="index"></div></aside>
        <div id="sections"></div>
      </div>
    </section>

    <section class="page hidden" data-page="ingame">
      <div class="ingame">
        <div class="live" id="srLive"><i class="dot" id="srDot"></i><span id="srLiveText"></span></div>
        <div class="section" style="margin:0">
          <h2 data-t="sr.title"></h2><p data-t="sr.sub"></p>
          <div class="rows" id="srRows"></div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:12px"><button id="btnSrApply" class="btn btn-line" data-t="sr.apply"></button><span class="muted" data-t="sr.f9"></span></div>
        </div>
        <div class="section" style="margin:0">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px">
            <div><h2 data-t="games.title"></h2><p id="gamesSub" data-t="games.sub"></p></div>
            <button id="btnGames" class="btn btn-primary" data-t="games.find"></button>
          </div>
          <div class="rows" style="padding:0"><ul class="games" id="games"></ul></div>
          <div class="addrow" style="margin-top:10px"><input id="gamePath" class="field" spellcheck="false"><button id="btnGameAdd" class="btn btn-line" data-t="games.add"></button></div>
          <p class="muted" style="margin-top:10px;font-size:12px" data-t="games.safe"></p>
        </div>
      </div>
    </section>

    <footer class="status"><i id="statusDot" class="dot"></i><span id="status"></span></footer>
  </main>
</div>

<dialog id="picker">
  <div class="dlg-head"><h3 id="pickerTitle"></h3><button class="btn btn-quiet" data-close data-t="close"></button></div>
  <input id="pickerSearch" class="field dlg-search" type="search" autocomplete="off">
  <ul id="pickerList" class="picks"></ul>
  <div class="dlg-foot" id="pickerFoot"></div>
</dialog>

  $("#statusDot").classList.toggle("on", la || oa);
  if (S.limiter_exe) {
    const ex = esc(short(L_.exe || S.limiter_exe));
    $("#limState").innerHTML = !la ? t("lim.wait", ex) : L_.enabled ? t("lim.on", ex, L_.cap.toFixed(2)) + ` · ${esc(L_.api)}${L_.w ? ` · ${L_.w}×${L_.h}` : ""}` : t("lim.paused", ex);
  }
  $("#srLive").dataset.on = !!R.active; $("#srDot").classList.toggle("on", !!R.active);
  $("#srLiveText").textContent = R.active ? t("sr.live", R.exe, R.api, `${R.rw}×${R.rh}`, `${R.ow}×${R.oh}`, R.gpu_ms > 0 ? R.gpu_ms.toFixed(2) + " ms GPU" : t("sr.measuring")) : t("sr.idle");
}

// ---------------------------------------------------------------- window picker
let pickMode = "scale", pickList = [];
function openPicker(mode) {
  pickMode = mode;
  $("#pickerTitle").textContent = t("pick." + mode);
  $("#pickerFoot").textContent = t("pick.foot." + mode, hkText(S.app.hk_scale ?? 0));
  $("#pickerSearch").value = ""; $("#pickerList").innerHTML = `<li class="pick muted">${t("pick.loading")}</li>`;
  $("#picker").showModal(); $("#pickerSearch").focus(); send({ t: "windows" });
}
function renderPicks() {
  const q = $("#pickerSearch").value.trim().toLowerCase();
  const l = pickList.filter(w => !q || (w.exe + " " + w.title).toLowerCase().includes(q));
  $("#pickerList").innerHTML = l.length ? l.map(w => `<li class="pick" tabindex="0" data-hwnd="${w.hwnd}" data-exe="${esc(w.exe)}"><b>${esc(short(w.exe))}</b><span>${esc(w.title)}</span></li>`).join("")
    : `<li class="pick muted">${t("pick.none")}</li>`;
}
$("#pickerSearch").addEventListener("input", renderPicks);
$("#pickerSearch").addEventListener("keydown", e => { if (e.key === "Enter") $("#pickerList [data-hwnd]")?.click(); });
$("#picker").addEventListener("click", e => {
  if (e.target.closest("[data-close]") || e.target === $("#picker")) { $("#picker").close(); return; }
  const li_ = e.target.closest("[data-hwnd]"); if (!li_) return;
  const hwnd = +li_.dataset.hwnd;
  if (pickMode === "scale") send({ t: "scale", hwnd }); else if (pickMode === "limit") send({ t: "limit", hwnd }); else send({ t: "profile", op: "add", name: li_.dataset.exe });
  $("#picker").close();
});
$("#picker").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-hwnd]")) e.target.click(); });
$("#btnScale").addEventListener("click", () => S.scaling ? send({ t: "scale" }) : openPicker("scale"));
$("#btnLimit").addEventListener("click", () => S.limiter_exe ? send({ t: "limit", off: true }) : openPicker("limit"));
$("#btnAddProfile").addEventListener("click", () => openPicker("profile"));
$("#btnRemoveProfile").addEventListener("click", () => send({ t: "profile", op: "remove" }));
$("#profile").addEventListener("change", e => send({ t: "profile", op: "select", name: e.target.value }));
$("#btnRtss").addEventListener("click", () => send({ t: "rtss" }));
$("#btnSmooth").addEventListener("click", () => { for (const [k, v] of [["limiter", 1], ["cap_mode", 4], ["sync", 2]]) setVal(k, v, true); renderAll(); });

// ---------------------------------------------------------------- games
function onGames(m) {
  $("#btnGames").disabled = m.busy; $("#btnGames").textContent = m.busy ? t("games.busy") : t("games.find");
  $("#games").innerHTML = m.list.length ? m.list.map(g => {
    const tags = g.has.map(h => `<span class="chip">${esc(h)}</span>`).join("");
    const st = g.state ? `<span class="chip on">${esc(g.state)}</span>` : "";
    const btn = (op, label, cls) => `<button class="btn ${cls}" data-root="${esc(g.root)}" data-op="${op}" ${m.busy ? "disabled" : ""}>${t(label)}</button>`;
    const act = g.anticheat ? `<span class="muted">${t("games.ac")}</span>` : g.state ? btn("restore", "games.restore", "btn-line") : g.direct ? btn("install", "games.install", "btn-primary") : `<span class="muted">${t("games.need")}</span>`;
    return `<li><div style="min-width:0"><div class="name">${esc(g.name)} <span class="muted" style="font-weight:400">${esc(g.store)}</span></div><div class="meta">${st}${tags || `<span class="muted">${t("games.nodll")}</span>`}</div></div>
      <div class="acts">${act}${btn("open", "games.folder", "btn-quiet")}</div></li>`;
  }).join("") : `<li class="muted">${m.busy ? t("games.busy") : t("games.empty")}</li>`;
}
$("#games").addEventListener("click", e => { const b = e.target.closest("[data-op]"); if (b) send({ t: "game", root: b.dataset.root, op: b.dataset.op }); });
$("#btnGames").addEventListener("click", () => send({ t: "games" }));
$("#btnGameAdd").addEventListener("click", () => { const p = $("#gamePath").value.trim(); if (p) { send({ t: "game_add", path: p }); $("#gamePath").value = ""; } });
$("#btnSrApply").addEventListener("click", () => send({ t: "sr_apply" }));

// ---------------------------------------------------------------- wiring
window.chrome?.webview?.addEventListener("message", e => {
  const m = e.data;
  if (m.t === "schema") { S.opts = m.opts; S.byKey = Object.fromEntries(m.opts.map(o => [o.key, o])); }
  else if (m.t === "state") onState(m);
  else if (m.t === "tele") onTele(m);
  else if (m.t === "status") setStatus(m.code, m.args);
  else if (m.t === "go") go(m.page);
  else if (m.t === "games") onGames(m);
  else if (m.t === "windows") { pickList = m.list; renderPicks(); }
});
$("#lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch {} i18n(); renderAll(); go(localStorage.getItem("page") || "home"); if (lastStatus === "ready") setStatus("ready"); });
$("#lang").value = lang || "pt";
i18n();
$("#status").textContent = t("ready"); lastStatus = "";
let start = "home"; try { start = localStorage.getItem("page") || start; } catch {}
if (!["home", "settings", "ingame"].includes(start)) start = "home";
go(start); draw(); send({ t: "ready" });
</script>
</body>
</html>
