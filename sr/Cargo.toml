[package]
name = "flowscale_sr"
version = "2.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "flowscale_sr"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Performance", "Win32_Security",
]

[lints.rust]
linker_messages = "allow"
